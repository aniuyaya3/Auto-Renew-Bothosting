name: Auto Renew Bot-hosting

on:
  schedule:
    - cron: '30 22 * * *' # 每天UTC 1点 (北京时间9点, 一般都会推迟),自行根据服务到期时间调整
  workflow_dispatch:

jobs:
  Renew-bot:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write # 回写 time.txt 需要写权限（原为 read）

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum python3 app.py

      - name: 🕐 生成并回写 time.txt
        if: always() # 续期成功/失败都记录本次运行时间
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          write_time() {
            {
              echo "Last run: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S') (Asia/Shanghai)"
              echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
              echo "Workflow: ${WORKFLOW_NAME}"
              echo "Run: #${RUN_NUMBER} (attempt ${RUN_ATTEMPT})"
              echo "Trigger: ${EVENT_NAME}"
            } > time.txt
          }
          write_time
          cat time.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add time.txt
          if git diff --cached --quiet; then
            echo "time.txt 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: update time.txt [skip ci]"
          if git push origin "HEAD:${BRANCH_NAME}"; then
            echo "✅ time.txt 已回写仓库"
            exit 0
          fi
          echo "⚠️ push 被拒绝（远程分支已前进），基于最新远程重新生成后重试一次"
          git fetch origin "${BRANCH_NAME}"
          git reset --hard "origin/${BRANCH_NAME}"
          write_time
          git add time.txt
          if git diff --cached --quiet; then
            echo "重新生成后无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: update time.txt [skip ci]"
          git push origin "HEAD:${BRANCH_NAME}"
          echo "✅ time.txt 已回写仓库（重试成功）"

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
